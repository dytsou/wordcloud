name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Run linter
        run: pnpm run lint

      - name: Generate Cloudflare types
        run: pnpm run cf-typegen

      - name: Run type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:ci

      - name: Build application
        run: pnpm run build

      - name: Validate OpenAPI contract
        run: pnpm run api:lint

      - name: Generate online API documentation
        run: pnpm run api:build

      - name: Validate Wrangler deployment
        run: pnpm run wrangler:dry-run

      - name: Verify generated API documentation
        run: |
          test -f dist/client/api/index.html
          test -f dist/client/api/openapi.yaml

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
