name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Run linter
        run: pnpm run lint

      - name: Prepare Cloudflare type output directory
        run: mkdir -p .wrangler

      - name: Generate Cloudflare types
        run: pnpm run cf-typegen

      - name: Run type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:ci

      - name: Build application
        run: pnpm run build

      - name: Validate OpenAPI contract
        run: pnpm run api:lint

      - name: Generate online API documentation
        run: pnpm run api:build

      - name: Validate Wrangler deployment
        run: pnpm run wrangler:dry-run

      - name: Verify generated API documentation
        run: |
          test -f dist/client/api/index.html
          test -f dist/client/api/openapi.yaml

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: wordcloud-production
      cancel-in-progress: false
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact from CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Verify deployment artifact
        run: |
          test -f dist/client/index.html
          test -f dist/wordcloud/wrangler.json
          test -f dist/client/api/index.html
          test -f dist/client/api/openapi.yaml

      - name: Validate deployment artifact
        run: pnpm run wrangler:dry-run

      - name: Deploy Worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
