name = "wordcloud"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
main = "./src/worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/mcp",
  "/mcp/*",
  "/",
  "/index.html",
  "/view",
  "/view/*",
  "/create",
  "/create/*",
  "/about",
  "/about/*",
  "/zh-Hant/about",
  "/zh-Hant/about/*",
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
